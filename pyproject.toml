[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "py4dstem-radial"
version = "0.1.0"
description = "Volume-averaged scalar strain analysis for 4D-STEM nanobeam electron diffraction data designed for high-throughput analyses."
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "py4dstem-radial"
version = "0.1.0"
description = "Volume-averaged scalar strain analysis for 4D-STEM nanobeam electron diffraction data designed for high-throughput analyses."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.15.3",
    "matplotlib>=3.10.6",
    "py4DSTEM>=0.14.18",
    "pandas>=3.0.6",
    "openpyxl>=3.1.5",
]
[project.optional-dependencies]
windows = ["pywin32"]
gpu = [
    "cupy>=13.6.0",
    "numba>=0.61.2",
]
[tool.setuptools.packages.find]
where = ["src"]
